description: AXI MBOX XILINX

compatible: "xlnx,mailbox"

include: [base.yaml, mailbox-controller.yaml]

properties:
  reg:
    required: true
  
  clocks:
    required: true

  interrupts:
    required: true
  
  xlnx,recv-fsl:
    type: int
    default: 0
    required: false
    description: Receive Interrupt Threshold

  xlnx,send-fsl:
    type: int
    default: 0
    required: false
    description: Send Interrupt Threshold

interrupt-cells:
  - irq
  - priority