description: AXI MBOX XILINX

compatible: "xlnx,mailbox"

include: [base.yaml, mailbox-controller.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  xlnx,recv-it:
    type: int
    default: 16
    required: false
    description: Receive Interrupt Threshold

  xlnx,send-it:
    type: int
    default: 16
    required: false
    description: Send Interrupt Threshold
  xlnx,ip-name:
    type: string
  xlnx,name:
    type: string

interrupt-cells:
  - irq
  - priority
